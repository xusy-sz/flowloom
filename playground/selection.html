<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flowloom 宿主响应式接线（票 44 载体页）</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
      }
      #app {
        position: relative;
      }
      /* 演示条/读数面/侧栏（票 24 token 化惯例——色走库 token 随主题翻） */
      .fl-demo-bar {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 6;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 4px 8px;
        border: 1px solid var(--fl-panel-border, #e2e8f0);
        border-radius: 6px;
        background: var(--fl-panel-bg, #fff);
        box-shadow: 0 1px 2px rgb(15 23 42 / 8%);
        font:
          13px/1.6 system-ui,
          sans-serif;
        color: var(--fl-fg, #334155);
        max-width: calc(100% - 330px);
      }
      .fl-demo-bar button {
        padding: 2px 8px;
        border: none;
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
        background: color-mix(in srgb, var(--fl-fg-muted, #64748b) 14%, transparent);
      }
      .fl-demo-bar button:hover {
        background: color-mix(in srgb, var(--fl-selection, #2563eb) 12%, transparent);
      }
      .fl-demo-bar a {
        padding: 2px 8px;
        border: 1px solid var(--fl-panel-border, #e2e8f0);
        border-radius: 4px;
        color: var(--fl-fg, #334155);
        text-decoration: none;
      }
      .fl-demo-bar a:hover {
        border-color: var(--fl-selection, #2563eb);
        color: var(--fl-selection, #2563eb);
      }
      .fl-demo-stats {
        position: absolute;
        top: 120px;
        left: 8px;
        z-index: 6;
        padding: 4px 10px;
        border: 1px solid var(--fl-panel-border, #e2e8f0);
        border-radius: 6px;
        background: var(--fl-panel-bg, #fff);
        font:
          12px/1.6 ui-monospace,
          monospace;
        color: var(--fl-fg, #475569);
        white-space: pre;
      }
      .fl-demo-side {
        position: absolute;
        top: 8px;
        right: 8px;
        bottom: 8px;
        z-index: 6;
        width: 300px;
        padding: 8px 12px;
        border: 1px solid var(--fl-panel-border, #e2e8f0);
        border-radius: 6px;
        background: var(--fl-panel-bg, #fff);
        overflow-y: auto;
        font:
          12px/1.7 system-ui,
          sans-serif;
        color: var(--fl-fg, #334155);
      }
      .fl-demo-side > p {
        margin: 6px 0;
        color: var(--fl-fg-muted, #64748b);
      }
      .fl-demo-side code {
        font:
          11px/1.5 ui-monospace,
          monospace;
        background: color-mix(in srgb, var(--fl-fg-muted, #64748b) 12%, transparent);
        padding: 0 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="fl-demo-bar">
        <a class="fl-hub-link" href="./hub.html">⌂ 枢纽</a>
        <button id="fl-pan" type="button">平移镜头 +40（store 零发射）</button>
        <button id="fl-undo" type="button">撤销</button>
        <button id="fl-reset" type="button">复位图</button>
        <button id="fl-theme" type="button">主题：自动</button>
      </div>
      <div class="fl-demo-stats" id="fl-demo-stats"></div>
      <div class="fl-demo-side">
        <div id="fl-side"></div>
        <p>
          侧栏=mounted Svelte 组件 <code>$selection</code> 直用（宿主消费姿势——零 tick
          咒语）；「回写」走 <code>controller.setNodeData</code>——与画布/属性面板 共享同一
          controller，恰一张快照可撤销（首消费者实测确认的接缝）。
        </p>
        <p>
          读数面（左下）：store 发射计数+getSelectedNodes 一致性。试手：点节点/框选
          看侧栏跟随；<strong>平移镜头</strong>看发射数不动（无关通知零发射——store 是
          投影非副本）；回写后撤销看侧栏 data 回跳。
        </p>
      </div>
    </div>
    <script type="module" src="./selection-demo.js"></script>
  </body>
</html>
