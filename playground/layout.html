<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flowloom 数据驱动布局演示</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
      }
      #app {
        position: relative;
      }
      /* 演示条/读数面（票 24 token 化：原硬编码浅色值深色下不可读——色走库 token
       * 随主题翻，theme.html 同款姿势；回退值即原浅色值） */
      .fl-demo-bar {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 6;
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 4px 8px;
        border: 1px solid var(--fl-panel-border, #e2e8f0);
        border-radius: 6px;
        background: var(--fl-panel-bg, #fff);
        box-shadow: 0 1px 2px rgb(15 23 42 / 8%);
        font:
          13px/1.6 system-ui,
          sans-serif;
        color: var(--fl-fg, #334155);
      }
      .fl-demo-bar button {
        padding: 2px 8px;
        border: none;
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
        background: none;
      }
      .fl-demo-bar button:hover {
        background: color-mix(in srgb, var(--fl-selection, #2563eb) 12%, transparent);
      }
      .fl-demo-bar a {
        padding: 2px 8px;
        border: 1px solid var(--fl-panel-border, #e2e8f0);
        border-radius: 4px;
        color: var(--fl-fg, #334155);
        text-decoration: none;
      }
      .fl-demo-bar a:hover {
        border-color: var(--fl-selection, #2563eb);
        color: var(--fl-selection, #2563eb);
      }
      .fl-demo-stats {
        position: absolute;
        bottom: 8px;
        left: 8px;
        z-index: 6;
        padding: 4px 10px;
        border: 1px solid var(--fl-panel-border, #e2e8f0);
        border-radius: 6px;
        background: color-mix(in srgb, var(--fl-panel-bg, #fff) 92%, transparent);
        box-shadow: 0 1px 2px rgb(15 23 42 / 8%);
        font:
          12px/1.7 ui-monospace,
          monospace;
        color: var(--fl-fg, #475569);
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./layout-demo.js"></script>
  </body>
</html>
